[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.28"
bytecode_hash = "ipfs"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
bsc_testnet = "${BSC_RPC_URL}"
bsc_mainnet = "https://bsc-dataseed1.binance.org"

[etherscan]
bsc_testnet = { key = "${ETHERSCAN_API_KEY}", url = "https://api-testnet.bscscan.com/api" }
bsc_mainnet = { key = "${ETHERSCAN_API_KEY}", url = "https://api.bscscan.com/api" }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
