version: "3.9"

services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: memeai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: memeai
      POSTGRES_PASSWORD: memeai_dev
      POSTGRES_DB: meme_ai_analyze
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memeai -d meme_ai_analyze"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================
  # Redis Cache
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: memeai-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ============================================
  # Go Backend API
  # ============================================
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: memeai-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: memeai
      POSTGRES_PASSWORD: memeai_dev
      POSTGRES_DB: meme_ai_analyze
      REDIS_HOST: redis
      REDIS_PORT: 6379
      BSC_RPC_URL: ${BSC_RPC_URL:-https://data-seed-prebsc-1-s1.binance.org:8545}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ORACLE_CONTRACT_ADDRESS: ${ORACLE_CONTRACT_ADDRESS:-}
      ORACLE_PRIVATE_KEY: ${ORACLE_PRIVATE_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================
  # Next.js Frontend
  # ============================================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: memeai-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://api:8080
      NEXT_PUBLIC_WS_URL: ws://api:8080
      NEXT_PUBLIC_CHAIN_ID: "97"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
